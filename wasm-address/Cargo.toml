[package]
name = "address-benchmark-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
k256 = { version = "0.13.4", default-features = false, features = ["arithmetic"] }
sha3 = { version = "0.10.8", default-features = false }
wasm-bindgen = "0.2.106"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
